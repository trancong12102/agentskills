name: ci

# Gates the release PR: release-plz merges produce tags, so anything red here
# must never reach main.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The crate lives in plugins/ora/mcp but the workspace root is the repo
      # root, so cargo's target/ — and the cache — belong here.
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: plugins/ora/mcp/Cargo.toml

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      # bun.lock is gitignored in this repo, so there is no lockfile to freeze.
      - run: bun install
      - run: bunx markdownlint-cli2
