name: ci

# Gates the release PR: release-plz merges produce tags, so anything red here
# must never reach main.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The crate lives in plugins/ora/mcp but the workspace root is the repo
      # root, so cargo's target/ — and the cache — belong here.
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

      # ast-grep is a runtime dependency, and the half of the end-to-end suite
      # that drives it needs no network, so it can gate merges. The `net_` half
      # stays out: a docs site going down is not a reason to redden this repo.
      #
      # Deliberately unpinned. The Homebrew formula depends on whatever ast-grep
      # is current, so the language sweep is only meaningful against that same
      # moving target — a pin here would hide the drift it exists to catch.
      - run: npm install -g @ast-grep/cli
      - run: cargo test --test e2e -- --ignored local_

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: plugins/ora/mcp/Cargo.toml

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      # bun.lock is gitignored in this repo, so there is no lockfile to freeze.
      - run: bun install
      - run: bunx markdownlint-cli2
