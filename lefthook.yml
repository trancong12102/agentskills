pre-commit:
  parallel: true
  commands:
    oxfmt:
      glob: "*.{md,json,jsonc}"
      run: bunx oxfmt {staged_files}
      stage_fixed: true

    markdownlint-md:
      glob: "*.md"
      run: bunx markdownlint-cli2 --fix {staged_files}
      stage_fixed: true

    log-answer:
      glob: "plugins/ora/{hooks,tests}/**"
      run: cd plugins/ora && bun test tests/log-answer.test.ts

    actionlint:
      glob: ".github/workflows/*.yml"
      run: actionlint {staged_files}
